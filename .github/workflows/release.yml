name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm trusted publishing 走 OIDC,不需要任何 token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing 要求 npm CLI >= 11.5.1
      - name: Ensure npm 11.5.1+
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 打 tag 发版时,校验 tag 与 package.json 版本一致
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的 ${version} 不一致"
            exit 1
          fi

      # prepublishOnly 会自动跑 build + test,失败即中止发布
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
